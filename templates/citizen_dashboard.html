
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Dashboard | JanSeva AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="logo">JanSeva AI</div>

    <nav>
        <a href="{{ url_for('lodge') }}">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<main class="auth-section">

    <section class="auth-card">

        <h1 class="auth-heading">
            Welcome, {{ user.full_name }}!
        </h1>

        <p class="small-title">
            Your Citizen Dashboard
        </p>

        <div class="dashboard-actions">

            <a href="{{ url_for('lodge') }}"
               class="submit-grievance">
                Lodge New Grievance
            </a>

            <a href="{{ url_for('my_grievances') }}"
               class="submit-grievance">
                My Grievances
            </a>

            <a href="{{ url_for('home') }}#track"
               class="submit-grievance">
                Track Grievance
            </a>

        </div>

    </section>

</main>

</body>
</html>
